<section class="bg-secondcolor border p-10 mt-5">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
    <!-- Categories -->
    <div class="md:col-span-1">
      <h2 class="text-maincolor pt-8 text-2xl font-bold mb-5">Categories</h2>

      <div class="flex flex-col gap-3">
        @for (category of categorylist; track $index) {
          <button
            (click)="getmealsbycategorydata(category)"
            class="bg-maincolor text-secondcolor p-4 border border-default rounded-base hover:bg-secondcolor text-left cursor-pointer"
          >
            <h5 class="text-xl font-semibold text-secondcolor hover:text-maincolor">
              {{ category }}
            </h5>
          </button>
        }
      </div>
    </div>

    <!-- Related Recipes -->
    <div class="md:col-span-3">
      <h2 class="text-maincolor pt-8 text-2xl font-bold mb-5 font-semibold">Recipes</h2>

      <div class="grid md:grid-cols-3 gap-5">
        @for (meal of mealsbycategorylist; track meal.id) {
          <div class="bg-maincolor p-4 rounded">
            <img [src]="meal.image" [alt]="meal.name" class="rounded w-full h-48 object-cover" />

            <h3 class="text-secondcolor mt-3 text-lg font-medium">
              {{ meal.name }}
            </h3>
          </div>
        }
      </div>
    </div>
  </div>
</section>
